[package]
publish = ["crates-io"]
readme = "README.md"
include = ["build.rs", "native/**", "src/**", "tests/**", "examples/**", "test-vectors/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
name = "age-plugin-phone-platform-keys"
description = "Hardware-backed desktop key custody for age-plugin-phone"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[target.'cfg(windows)'.dependencies]
age-plugin-phone-core.workspace = true
p256.workspace = true
rand_core.workspace = true
thiserror.workspace = true
zeroize.workspace = true
windows-version.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_TpmBaseServices",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Dependencies for the isolated M0 research examples only.
[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10.1"
security-framework = { version = "3.7.0", default-features = false, features = ["OSX_10_15", "sync-keychain"] }
security-framework-sys = "2.17.0"
p256.workspace = true
sha2.workspace = true
zeroize.workspace = true
base64.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints.clippy]
all = "warn"
pedantic = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
age-plugin-phone-core.workspace = true
p256.workspace = true
zeroize.workspace = true
thiserror.workspace = true
