[package]
publish = ["crates-io"]
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "test-vectors/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
name = "age-plugin-phone-platform-keys"
description = "Windows TPM-backed desktop key custody for age-plugin-phone"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[target.'cfg(windows)'.dependencies]
age-plugin-phone-core.workspace = true
p256.workspace = true
rand_core.workspace = true
thiserror.workspace = true
zeroize.workspace = true
windows-version.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_TpmBaseServices",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
