[package]
name = "age-plugin-phone-windows-cng"
description = "Windows TPM-backed desktop key custody for age-plugin-phone"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[target.'cfg(windows)'.dependencies]
age-plugin-phone-protocol = { path = "../protocol" }
age-plugin-phone-recipient-p256 = { path = "../recipient-p256" }
p256.workspace = true
rand_core.workspace = true
thiserror.workspace = true
zeroize.workspace = true
windows-version.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_TpmBaseServices",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
