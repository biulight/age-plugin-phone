[workspace]
members = [
    "apps/mobile/src-tauri",
    "crates/desktop",
    "crates/protocol",
    "crates/recipient-p256",
    "plugins/tauri-plugin-phone-identity",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/biulight/age-plugin-phone"
rust-version = "1.85"
version = "0.0.1"

[workspace.dependencies]
age-core = { version = "0.11.0", features = ["plugin"] }
age-plugin = "0.6.1"
base64 = "0.22.1"
bech32 = "0.9.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5", features = ["derive"] }
hkdf = "0.12.4"
minicbor = { version = "0.25.1", features = ["alloc"] }
p256 = { version = "0.13.2", features = ["ecdh"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = "2"
tauri-build = "2"
tauri-plugin = { version = "2", features = ["build"] }
thiserror = "2"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
