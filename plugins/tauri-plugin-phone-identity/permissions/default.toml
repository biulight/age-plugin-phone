"$schema" = "schemas/schema.json"

[default]
description = "Allows product identity, pairing, unwrap, and lifecycle commands."
permissions = [
    "allow-scan-pairing-offer",
    "allow-pair-phone",
    "allow-pair-phone-usb",
    "allow-unwrap-phone",
    "allow-unwrap-phone-wifi",
    "allow-cancel-wifi-unwrap",
    "allow-wifi-unwrap-status",
    "allow-identity-status",
    "allow-provision-identity",
    "allow-revoke-pairing",
    "allow-delete-identity",
]
