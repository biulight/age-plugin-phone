name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run portable workspace tests
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked
      - name: Run portable workspace tests without TPM hardware integration
        if: runner.os == 'Windows'
        run: >-
          cargo test --workspace --locked --
          --skip windows::tests::provisions_distinct_non_exportable_keys_and_reopens_them
          --skip windows::tests::partial_key_pair_fails_closed_without_repair
          --skip desktop_cleanup::tests::native_cleanup_removes_exact_files_and_tpm_keys
          --skip desktop_cleanup::tests::concurrent_replay_owner_prevents_cleanup_journal_creation
          --skip desktop_cleanup::tests::native_orphan_cleanup_requires_exact_confirmation_and_removes_private_state
          --skip desktop_cleanup::tests::orphan_cleanup_rejects_concurrent_replay_owner_without_a_journal
          --skip desktop_cleanup::tests::orphan_cleanup_rejects_locator_bound_to_the_wrong_desktop_state
      - name: Packaged binary smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked -p age-plugin-phone
          target/release/age-plugin-phone.exe --help
          target/release/age-plugin-phone.exe setup --help

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/mobile/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Frontend dependencies
        working-directory: apps/mobile
        run: bun install --frozen-lockfile
      - name: TypeScript production build
        working-directory: apps/mobile
        run: bun run build
      - name: Generate Android build settings
        working-directory: apps/mobile
        run: |
          set -o pipefail
          bun run tauri android init --ci --skip-targets-install
          tauri_manifest="$(cargo metadata --format-version 1 --locked --manifest-path src-tauri/Cargo.toml \
            | jq --exit-status --raw-output \
              '[.packages[] | select(.name == "tauri") | .manifest_path]
               | if length == 1 then .[0] else error("expected exactly one tauri package") end')"
          test -f "$tauri_manifest"
          tauri_android_dir="$(dirname "$tauri_manifest")/mobile/android"
          test -d "$tauri_android_dir"
          printf 'TAURI_ANDROID_DIR=%s\n' "$tauri_android_dir" >> "$GITHUB_ENV"
          cat > src-tauri/gen/android/tauri.settings.gradle <<'GRADLE'
          include ':tauri-android'
          project(':tauri-android').projectDir = new File(System.getenv('TAURI_ANDROID_DIR'))
          include ':tauri-plugin-phone-identity'
          project(':tauri-plugin-phone-identity').projectDir = new File(System.getenv('GITHUB_WORKSPACE'), 'plugins/tauri-plugin-phone-identity/android')
          GRADLE
          cat > src-tauri/gen/android/app/tauri.build.gradle.kts <<'KOTLIN'
          // THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          val implementation by configurations
          dependencies {
            implementation("androidx.lifecycle:lifecycle-process:2.10.0")
            implementation(project(":tauri-android"))
            implementation(project(":tauri-plugin-phone-identity"))
          }
          KOTLIN
      - name: Kotlin vectors and negative tests
        working-directory: apps/mobile/src-tauri/gen/android
        run: ./gradlew :tauri-plugin-phone-identity:testDebugUnitTest --no-daemon

  reproducible-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require committed locks and wrapper verification
        run: |
          test -f Cargo.lock
          test -f apps/mobile/bun.lock
          test -f apps/mobile/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          grep -q '^distributionSha256Sum=' apps/mobile/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          scripts/check-release-version.sh

  release-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise Alpha release staging validation fixtures
        run: |
          scripts/test-prepare-alpha-release-publish.sh
          scripts/test-validate-alpha-release-candidate.sh
      - name: Statically lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.9

  released-client-interoperability:
    runs-on: ubuntu-latest
    env:
      AGE_VERSION: "1.3.1"
      AGE_SHA256: bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
      RAGE_VERSION: "0.12.1"
      RAGE_SHA256: c5d7ab41fbf1213590e89721fd2b8eb122e84518c155ce35866f1c5759a3a29f
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build production plugin executable
        run: cargo build --release --locked -p age-plugin-phone
      - name: Fetch pinned released clients
        run: |
          mkdir -p "$RUNNER_TEMP/released-clients"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  $RUNNER_TEMP/age.tar.gz" | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/rage.tar.gz" \
            "https://github.com/str4d/rage/releases/download/v${RAGE_VERSION}/rage-v${RAGE_VERSION}-x86_64-linux.tar.gz"
          echo "${RAGE_SHA256}  $RUNNER_TEMP/rage.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/age.tar.gz" --directory "$RUNNER_TEMP/released-clients"
          tar --extract --gzip --file "$RUNNER_TEMP/rage.tar.gz" --directory "$RUNNER_TEMP/released-clients"
      - name: Cross-client plugin and recovery smoke
        run: |
          scripts/interoperability-smoke.sh \
            "$RUNNER_TEMP/released-clients/age/age" \
            "$RUNNER_TEMP/released-clients/age/age-keygen" \
            "$RUNNER_TEMP/released-clients/rage/rage" \
            "$RUNNER_TEMP/released-clients/rage/rage-keygen" \
            "$GITHUB_WORKSPACE/target/release/age-plugin-phone"
