name: Test-signed Alpha artifacts

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer without the leading v; must match every application manifest
        required: true
        default: 0.1.0-alpha.1
        type: string

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        name: Validate release version
        env:
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          version="$(scripts/check-release-version.sh "$REQUESTED_RELEASE_VERSION")"
          test -f "docs/releases/v$version.md"
          printf 'release_version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: metadata
    runs-on: windows-latest
    environment: alpha-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
      - name: Build locked Windows x64 binary
        run: cargo build --release --locked -p age-plugin-phone
      - name: Restore and authenticate Windows test signing certificate
        shell: pwsh
        env:
          WINDOWS_TEST_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_TEST_CERTIFICATE_BASE64 }}
          WINDOWS_TEST_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_TEST_CERTIFICATE_PASSWORD }}
          WINDOWS_TEST_CERTIFICATE_SHA256: ${{ vars.WINDOWS_TEST_CERTIFICATE_SHA256 }}
          WINDOWS_TEST_ROOT_CERTIFICATE_BASE64: ${{ vars.WINDOWS_TEST_ROOT_CERTIFICATE_BASE64 }}
          WINDOWS_TEST_ROOT_CERTIFICATE_SHA256: ${{ vars.WINDOWS_TEST_ROOT_CERTIFICATE_SHA256 }}
        run: |
          function Test-CodeSigningEku {
            param([Security.Cryptography.X509Certificates.X509Certificate2]$Certificate)
            foreach ($extension in $Certificate.Extensions) {
              if ($extension.Oid.Value -eq "2.5.29.37") {
                $eku = New-Object Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension($extension, $extension.Critical)
                return @($eku.EnhancedKeyUsages | Where-Object Value -eq "1.3.6.1.5.5.7.3.3").Count -eq 1
              }
            }
            return $false
          }
          function Test-CertificateAuthority {
            param([Security.Cryptography.X509Certificates.X509Certificate2]$Certificate)
            foreach ($extension in $Certificate.Extensions) {
              if ($extension.Oid.Value -eq "2.5.29.19") {
                $constraints = New-Object Security.Cryptography.X509Certificates.X509BasicConstraintsExtension($extension, $extension.Critical)
                return $constraints.CertificateAuthority
              }
            }
            return $false
          }
          function Get-CertificateSha256 {
            param([Security.Cryptography.X509Certificates.X509Certificate2]$Certificate)
            return [BitConverter]::ToString(
              [Security.Cryptography.SHA256]::Create().ComputeHash($Certificate.RawData)
            ).Replace("-", "")
          }
          $required = @(
            "WINDOWS_TEST_CERTIFICATE_BASE64",
            "WINDOWS_TEST_CERTIFICATE_PASSWORD",
            "WINDOWS_TEST_CERTIFICATE_SHA256",
            "WINDOWS_TEST_ROOT_CERTIFICATE_BASE64",
            "WINDOWS_TEST_ROOT_CERTIFICATE_SHA256"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required Windows test-signing configuration is missing: $name"
            }
          }
          $expected = $env:WINDOWS_TEST_CERTIFICATE_SHA256.Replace(":", "").Replace(" ", "").ToUpperInvariant()
          $rootExpected = $env:WINDOWS_TEST_ROOT_CERTIFICATE_SHA256.Replace(":", "").Replace(" ", "").ToUpperInvariant()
          if ($expected -notmatch "^[0-9A-F]{64}$" -or $rootExpected -notmatch "^[0-9A-F]{64}$") {
            throw "Windows certificate fingerprints must each be one SHA-256 fingerprint"
          }
          $pfx = Join-Path $env:RUNNER_TEMP "alpha-test-signing.pfx"
          $rootCertificate = Join-Path $env:RUNNER_TEMP "alpha-test-root.cer"
          $imported = @()
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_TEST_CERTIFICATE_BASE64))
            [IO.File]::WriteAllBytes($rootCertificate, [Convert]::FromBase64String($env:WINDOWS_TEST_ROOT_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_TEST_CERTIFICATE_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $root = [Security.Cryptography.X509Certificates.X509Certificate2]::new($rootCertificate)
            $signers = @($imported | Where-Object {
              $_.HasPrivateKey -and (Test-CodeSigningEku -Certificate $_)
            })
            if ($signers.Count -ne 1) {
              throw "Windows test PFX must contain exactly one code-signing certificate with a private key"
            }
            $signer = $signers[0]
            if ($root.Subject -ne $root.Issuer -or -not (Test-CertificateAuthority -Certificate $root)) {
              throw "Windows test root must be a self-signed certificate authority"
            }
            if ($signer.Issuer -ne $root.Subject) {
              throw "Windows test signing certificate was not issued by the configured test root"
            }
            if (
              $signer.NotBefore.ToUniversalTime() -gt [DateTime]::UtcNow -or
              $signer.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow -or
              $root.NotBefore.ToUniversalTime() -gt [DateTime]::UtcNow -or
              $root.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow
            ) {
              throw "Windows test certificate chain is not currently valid"
            }
            $actual = Get-CertificateSha256 -Certificate $signer
            $rootActual = Get-CertificateSha256 -Certificate $root
            if ($actual -ne $expected -or $rootActual -ne $rootExpected) {
              throw "Windows test certificate-chain fingerprint mismatch"
            }
            $chain = New-Object Security.Cryptography.X509Certificates.X509Chain
            $chain.ChainPolicy.TrustMode = [Security.Cryptography.X509Certificates.X509ChainTrustMode]::CustomRootTrust
            $chain.ChainPolicy.CustomTrustStore.Add($root) | Out-Null
            $chain.ChainPolicy.RevocationMode = [Security.Cryptography.X509Certificates.X509RevocationMode]::NoCheck
            if (-not $chain.Build($signer) -or $chain.ChainElements.Count -ne 2) {
              throw "Windows test signing certificate does not form the expected two-certificate chain"
            }
            $chainRoot = $chain.ChainElements[$chain.ChainElements.Count - 1].Certificate
            if ((Get-CertificateSha256 -Certificate $chainRoot) -ne $rootExpected) {
              throw "Windows test signing certificate chained to an unexpected root"
            }
            $windowsKits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
            $signTool = Get-ChildItem $windowsKits -Recurse -Filter signtool.exe |
              Where-Object FullName -Match "\\x64\\signtool.exe$" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) {
              throw "Windows SDK x64 SignTool is unavailable"
            }
            "WINDOWS_TEST_CERTIFICATE_THUMBPRINT=$($signer.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
            "WINDOWS_TEST_CERTIFICATE_SHA256_VALIDATED=$($actual.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
            "WINDOWS_TEST_ROOT_CERTIFICATE_SHA256_VALIDATED=$($rootActual.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
            "SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          } catch {
            foreach ($certificate in $imported) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $pfx, $rootCertificate -Force -ErrorAction SilentlyContinue
            throw
          }
          Remove-Item -LiteralPath $pfx -Force
      - name: Sign with the Windows test certificate
        shell: pwsh
        run: |
          if ($env:WINDOWS_TEST_CERTIFICATE_THUMBPRINT -notmatch "^[0-9A-Fa-f]{40}$") {
            throw "Validated Windows test certificate thumbprint is unavailable"
          }
          if (-not (Test-Path -LiteralPath $env:SIGNTOOL_PATH -PathType Leaf)) {
            throw "Validated Windows SDK SignTool path is unavailable"
          }
          & $env:SIGNTOOL_PATH sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 $env:WINDOWS_TEST_CERTIFICATE_THUMBPRINT target/release/age-plugin-phone.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Windows test signing failed"
          }
      - name: Smoke and digest
        shell: pwsh
        run: |
          target/release/age-plugin-phone.exe --help
          $verification = @(& $env:SIGNTOOL_PATH verify /pa /all /v target/release/age-plugin-phone.exe 2>&1)
          $verifyExitCode = $LASTEXITCODE
          $verification | Set-Content -Encoding utf8NoBOM target/release/signature-verification.txt
          $signature = Get-AuthenticodeSignature target/release/age-plugin-phone.exe
          if ($null -eq $signature.SignerCertificate -or $null -eq $signature.TimeStamperCertificate) {
            throw "Authenticode signer or timestamp certificate is unavailable"
          }
          $publicTrustStatus = $signature.Status.ToString()
          if ($verifyExitCode -eq 0 -or $publicTrustStatus -notin @("UnknownError", "NotTrusted")) {
            throw "Authenticode verification did not fail solely because the private test root is untrusted"
          }
          $certificateHash = [BitConverter]::ToString(
            [Security.Cryptography.SHA256]::Create().ComputeHash($signature.SignerCertificate.RawData)
          ).Replace("-", "").ToLowerInvariant()
          if ($certificateHash -ne $env:WINDOWS_TEST_CERTIFICATE_SHA256_VALIDATED) {
            throw "Authenticode signer fingerprint mismatch"
          }
          $rootCertificate = Join-Path $env:RUNNER_TEMP "alpha-test-root.cer"
          $root = [Security.Cryptography.X509Certificates.X509Certificate2]::new($rootCertificate)
          $chain = New-Object Security.Cryptography.X509Certificates.X509Chain
          $chain.ChainPolicy.TrustMode = [Security.Cryptography.X509Certificates.X509ChainTrustMode]::CustomRootTrust
          $chain.ChainPolicy.CustomTrustStore.Add($root) | Out-Null
          $chain.ChainPolicy.RevocationMode = [Security.Cryptography.X509Certificates.X509RevocationMode]::NoCheck
          if (-not $chain.Build($signature.SignerCertificate) -or $chain.ChainElements.Count -ne 2) {
            throw "Authenticode signer failed in-memory test-root chain validation"
          }
          $chainRoot = $chain.ChainElements[$chain.ChainElements.Count - 1].Certificate
          $rootHash = [BitConverter]::ToString(
            [Security.Cryptography.SHA256]::Create().ComputeHash($chainRoot.RawData)
          ).Replace("-", "").ToLowerInvariant()
          if ($rootHash -ne $env:WINDOWS_TEST_ROOT_CERTIFICATE_SHA256_VALIDATED) {
            throw "Authenticode signer chained to an unexpected test root"
          }
          $releaseVersion = "${{ needs.metadata.outputs.release_version }}"
          $packageName = "age-plugin-phone-$releaseVersion-windows-x64-alpha-test-signed.zip"
          $package = "target/release/$packageName"
          $releaseNotes = "docs/releases/v$releaseVersion.md"
          Compress-Archive -Path target/release/age-plugin-phone.exe,README.md,CHANGELOG.md,SECURITY.md,LICENSE,$releaseNotes,docs/windows-alpha-quickstart.md -DestinationPath $package
          $exeHash = (Get-FileHash target/release/age-plugin-phone.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $packageHash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  age-plugin-phone.exe" | Set-Content -Encoding utf8NoBOM target/release/SHA256SUMS.txt
          "$packageHash  $packageName" | Add-Content -Encoding utf8NoBOM target/release/SHA256SUMS.txt
          @(
            "commit: $env:GITHUB_SHA",
            "release_version: $releaseVersion",
            "workflow_run: $env:GITHUB_RUN_ID",
            "workflow_run_attempt: $env:GITHUB_RUN_ATTEMPT",
            "integrity_validation: Authenticode content and signature valid; public-trust verification rejected only the private test root",
            "public_trust_status: $publicTrustStatus",
            "custom_root_chain_validation: Valid",
            "trust_scope: private test root validated in memory and not installed in a Windows trust store",
            "certificate_subject: $($signature.SignerCertificate.Subject)",
            "certificate_issuer: $($signature.SignerCertificate.Issuer)",
            "certificate_sha256: $certificateHash",
            "root_certificate_sha256: $rootHash"
          ) | Add-Content -Encoding utf8NoBOM target/release/signature-verification.txt
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: age-plugin-phone-${{ needs.metadata.outputs.release_version }}-windows-x64-alpha-test-signed
          if-no-files-found: error
          path: |
            target/release/age-plugin-phone-${{ needs.metadata.outputs.release_version }}-windows-x64-alpha-test-signed.zip
            target/release/SHA256SUMS.txt
            target/release/signature-verification.txt
      - name: Remove restored Windows test certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_TEST_CERTIFICATE_THUMBPRINT -match "^[0-9A-Fa-f]{40}$") {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_TEST_CERTIFICATE_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          $pfx = Join-Path $env:RUNNER_TEMP "alpha-test-signing.pfx"
          $rootCertificate = Join-Path $env:RUNNER_TEMP "alpha-test-root.cer"
          Remove-Item -LiteralPath $pfx, $rootCertificate -Force -ErrorAction SilentlyContinue

  android:
    needs: metadata
    runs-on: ubuntu-latest
    environment: alpha-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
          targets: aarch64-linux-android
      - name: Restore and authenticate Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERTIFICATE_SHA256: ${{ secrets.ANDROID_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERTIFICATE_SHA256; do
            test -n "${!name:-}" || { echo "::error::Required Android signing secret is missing: $name"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alpha-release.p12"
          chmod 600 "$RUNNER_TEMP/alpha-release.p12"
          expected=$(printf '%s' "$ANDROID_CERTIFICATE_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          [[ "$expected" =~ ^[0-9A-F]{64}$ ]] || { echo "::error::ANDROID_CERTIFICATE_SHA256 must be one SHA-256 certificate fingerprint"; exit 1; }
          actual=$(
            keytool -exportcert \
              -keystore "$RUNNER_TEMP/alpha-release.p12" \
              -storetype PKCS12 \
              -storepass:env ANDROID_STORE_PASSWORD \
              -alias "$ANDROID_KEY_ALIAS" \
              | openssl dgst -sha256 -binary \
              | od -An -vtx1 \
              | tr -d ' \n' \
              | tr '[:lower:]' '[:upper:]'
          )
          test "$actual" = "$expected" || { echo "::error::Android signing certificate fingerprint mismatch"; exit 1; }
      - name: Build signed Android Alpha
        working-directory: apps/mobile
        env:
          AGE_PLUGIN_PHONE_ANDROID_KEYSTORE: ${{ runner.temp }}/alpha-release.p12
          AGE_PLUGIN_PHONE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          AGE_PLUGIN_PHONE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AGE_PLUGIN_PHONE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bun install --frozen-lockfile
          bun run tauri android build --apk --target aarch64
      - name: Verify Android signature and digest
        env:
          ANDROID_CERTIFICATE_SHA256: ${{ secrets.ANDROID_CERTIFICATE_SHA256 }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          outputs=apps/mobile/src-tauri/gen/android/app/build/outputs/apk
          mapfile -t apks < <(find "$outputs" -type f -path '*/release/*.apk')
          test "${#apks[@]}" -eq 1
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner"
          evidence_dir=$(dirname "${apks[0]}")
          evidence="$evidence_dir/signature-verification.txt"
          "$apksigner" verify --verbose --print-certs "${apks[0]}" | tee "$evidence"
          expected=$(printf '%s' "$ANDROID_CERTIFICATE_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          mapfile -t signer_digests < <(
            sed -n -E \
              -e 's/^Signer #[0-9]+ certificate SHA-256 digest: //p' \
              -e 's/^V[0-9.]+ Signer: certificate SHA-256 digest: //p' \
              "$evidence" \
              | tr -d ':[:space:]' \
              | tr '[:lower:]' '[:upper:]' \
              | sort -u
          )
          test "${#signer_digests[@]}" -eq 1 || { echo "::error::Expected exactly one Android APK signing certificate"; exit 1; }
          test "${signer_digests[0]}" = "$expected" || { echo "::error::Signed APK certificate fingerprint mismatch"; exit 1; }
          release_apk="$evidence_dir/age-plugin-phone-$RELEASE_VERSION-android-arm64.apk"
          mv "${apks[0]}" "$release_apk"
          sha256sum "$release_apk" | tee "$evidence_dir/SHA256SUMS.txt"
          {
            echo "commit: $GITHUB_SHA"
            echo "release_version: $RELEASE_VERSION"
            echo "workflow_run: $GITHUB_RUN_ID"
            echo "workflow_run_attempt: $GITHUB_RUN_ATTEMPT"
            echo "certificate_sha256: ${expected,,}"
          } >> "$evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: age-plugin-phone-${{ needs.metadata.outputs.release_version }}-android-alpha
          if-no-files-found: error
          path: |
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/release/age-plugin-phone-*.apk
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/release/SHA256SUMS.txt
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/release/signature-verification.txt
      - name: Remove restored Android signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/alpha-release.p12"
