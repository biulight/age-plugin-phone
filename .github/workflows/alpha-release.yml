name: Signed Alpha artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - name: Build locked Windows x64 binary
        run: cargo build --release --locked -p age-plugin-phone
      - name: Import signing certificate and sign
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) { throw "Windows signing secret is required" }
          $certificate = Join-Path $env:RUNNER_TEMP "alpha-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          signtool sign /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD target/release/age-plugin-phone.exe
          Remove-Item $certificate -Force
      - name: Smoke and digest
        shell: pwsh
        run: |
          target/release/age-plugin-phone.exe --help
          signtool verify /pa /all /v target/release/age-plugin-phone.exe | Tee-Object target/release/signature-verification.txt
          if ((Get-AuthenticodeSignature target/release/age-plugin-phone.exe).Status -ne "Valid") {
            throw "Authenticode verification failed"
          }
          $package = "target/release/age-plugin-phone-windows-x64-alpha.zip"
          Compress-Archive -Path target/release/age-plugin-phone.exe,README.md,LICENSE,docs/milestone-6-alpha.md -DestinationPath $package
          Get-FileHash target/release/age-plugin-phone.exe -Algorithm SHA256 | Format-List | Out-File target/release/SHA256SUMS.txt
          Get-FileHash $package -Algorithm SHA256 | Format-List | Add-Content target/release/SHA256SUMS.txt
          "commit: $env:GITHUB_SHA" | Add-Content target/release/signature-verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: age-plugin-phone-windows-x64-alpha
          if-no-files-found: error
          path: |
            target/release/age-plugin-phone-windows-x64-alpha.zip
            target/release/SHA256SUMS.txt
            target/release/signature-verification.txt

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: aarch64-linux-android
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alpha-release.jks"
      - name: Build signed Android Alpha
        working-directory: apps/mobile
        env:
          AGE_PLUGIN_PHONE_ANDROID_KEYSTORE: ${{ runner.temp }}/alpha-release.jks
          AGE_PLUGIN_PHONE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          AGE_PLUGIN_PHONE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AGE_PLUGIN_PHONE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bun install --frozen-lockfile
          bun run tauri android build --apk --target aarch64
      - name: Verify Android signature and digest
        run: |
          mapfile -t apks < <(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk/release -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "${apks[0]}" \
            | tee apps/mobile/src-tauri/gen/android/app/build/outputs/apk/release/signature-verification.txt
          sha256sum "${apks[0]}" \
            | tee apps/mobile/src-tauri/gen/android/app/build/outputs/apk/release/SHA256SUMS.txt
          echo "commit: $GITHUB_SHA" \
            >> apps/mobile/src-tauri/gen/android/app/build/outputs/apk/release/signature-verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: age-plugin-phone-android-alpha
          if-no-files-found: error
          path: |
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/release/*.apk
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/release/SHA256SUMS.txt
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/release/signature-verification.txt
